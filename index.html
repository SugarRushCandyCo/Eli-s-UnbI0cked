<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Eli's UnbI0cked</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #0a0c12;
      --surface:  #111420;
      --card:     #161b2e;
      --border:   #1e2540;
      --accent:   #00f0ff;
      --accent2:  #ff2d78;
      --accent3:  #7c3aed;
      --text:     #e8eaf6;
      --muted:    #5c6490;
      --glow:     0 0 20px rgba(0,240,255,.35);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── scanline overlay ── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,.08) 2px,
        rgba(0,0,0,.08) 4px
      );
      pointer-events: none;
    }

    /* ── HEADER ── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,12,18,.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 64px;
      display: flex; align-items: center; gap: 1.5rem;
    }

    .logo {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: 1.15rem;
      letter-spacing: .06em;
      color: var(--accent);
      text-shadow: var(--glow);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .logo span { color: var(--accent2); }

    .search-wrap {
      flex: 1;
      max-width: 480px;
      position: relative;
    }
    .search-wrap svg {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--muted); width: 16px; height: 16px;
    }
    #search {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .55rem .9rem .55rem 2.4rem;
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    #search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,240,255,.12);
    }
    #search::placeholder { color: var(--muted); }

    .tag-bar {
      display: flex; gap: .5rem; flex-wrap: wrap;
      margin-left: auto;
    }
    .tag {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'Rajdhani', sans-serif;
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: .3rem .75rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all .2s;
    }
    .tag:hover, .tag.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0,240,255,.06);
    }

    /* ── HERO ── */
    .hero {
      position: relative;
      padding: 4rem 2rem 2.5rem;
      text-align: center;
      overflow: hidden;
    }
    .hero-bg {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% -10%, rgba(0,240,255,.12) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 80% 60%, rgba(255,45,120,.08) 0%, transparent 60%);
      pointer-events: none;
    }
    .hero h1 {
      font-family: 'Orbitron', monospace;
      font-size: clamp(2rem, 5vw, 3.6rem);
      font-weight: 900;
      letter-spacing: .04em;
      line-height: 1.1;
      position: relative;
    }
    .hero h1 .hl { color: var(--accent); text-shadow: var(--glow); }
    .hero h1 .hl2 { color: var(--accent2); }
    .hero p {
      margin-top: .75rem;
      color: var(--muted);
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: .04em;
      position: relative;
    }
    .hero-stats {
      display: flex; gap: 2rem; justify-content: center;
      margin-top: 1.5rem;
      position: relative;
    }
    .stat { text-align: center; }
    .stat-num {
      font-family: 'Orbitron', monospace;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
    }
    .stat-label { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }

    /* ── GRID ── */
    .catalog {
      padding: 1.5rem 2rem 4rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    .section-label {
      font-family: 'Orbitron', monospace;
      font-size: .75rem;
      letter-spacing: .14em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 1.2rem;
      display: flex; align-items: center; gap: .75rem;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 1.1rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: transform .22s cubic-bezier(.34,1.56,.64,1),
                  border-color .22s,
                  box-shadow .22s;
      position: relative;
    }
    .card:hover {
      transform: translateY(-5px) scale(1.02);
      border-color: var(--accent);
      box-shadow: 0 8px 32px rgba(0,240,255,.18), 0 0 0 1px var(--accent);
    }
    .card:hover .card-overlay { opacity: 1; }

    .card-thumb {
      width: 100%;
      aspect-ratio: 16/10;
      object-fit: cover;
      display: block;
      background: var(--surface);
    }
    /* placeholder gradient for cards without real images */
    .card-thumb-placeholder {
      width: 100%;
      aspect-ratio: 16/10;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem;
    }

    .card-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,240,255,.07);
      opacity: 0;
      transition: opacity .2s;
      display: flex; align-items: center; justify-content: center;
    }
    .card-overlay svg {
      width: 44px; height: 44px;
      color: var(--accent);
      filter: drop-shadow(0 0 8px var(--accent));
    }

    .card-body {
      padding: .7rem .9rem .8rem;
    }
    .card-title {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: .02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta {
      display: flex; align-items: center; gap: .5rem;
      margin-top: .3rem;
    }
    .card-tag {
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .card-plays {
      font-size: .72rem;
      color: var(--accent2);
      font-weight: 600;
      margin-left: auto;
    }
    .dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #22c55e;
      flex-shrink: 0;
    }

    /* ── EMPTY STATE ── */
    #empty {
      display: none;
      text-align: center;
      padding: 5rem 2rem;
      color: var(--muted);
    }
    #empty .big { font-size: 3rem; }
    #empty p { margin-top: .5rem; font-size: 1rem; }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 1.5rem;
      color: var(--muted);
      font-size: .8rem;
      letter-spacing: .06em;
    }
    footer span { color: var(--accent); }
  </style>
</head>
<body>

<!-- ── HEADER ── -->
<header>
  <div class="logo">Eli's <span>UnbI0cked</span></div>

  <div class="search-wrap">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input id="search" type="text" placeholder="Search games…" autocomplete="off"/>
  </div>

  <div class="tag-bar">
    <button class="tag active" data-filter="all">All</button>
    <button class="tag" data-filter="action">Action</button>
    <button class="tag" data-filter="horror">Horror</button>
    <button class="tag" data-filter="sandbox">Sandbox</button>
    <button class="tag" data-filter="shooter">Shooter</button>
    <button class="tag" data-filter="other">Other</button>
  </div>
</header>

<!-- ── HERO ── -->
<section class="hero">
  <div class="hero-bg"></div>
  <h1><span class="hl">Eli's</span> <span class="hl2">UnbI0cked</span></h1>
  <p>No WiFi needed · No limits · Just play</p>
  <div class="hero-stats">
    <div class="stat"><div class="stat-num" id="totalGames">0</div><div class="stat-label">Games</div></div>
    <div class="stat"><div class="stat-num">∞</div><div class="stat-label">Access</div></div>
    <div class="stat"><div class="stat-num">0KB</div><div class="stat-label">Download</div></div>
  </div>
</section>

<!-- ── CATALOG ── -->
<main class="catalog">
  <div class="section-label">Game Library</div>
  <div class="grid" id="grid"></div>
  <div id="empty">
    <div class="big">🎮</div>
    <p>No games found. Try a different search.</p>
  </div>
</main>

<footer>
  <span>Eli's UnbI0cked</span> — Play anything, anywhere, anytime.
</footer>

<script>
  /* ─────────────────────────────────────────────
     GAME CATALOG DATA
     To add a game:
       1. Add an entry below
       2. Create the corresponding file (e.g. 5.html) in the same folder
         – that file should contain the actual game embed
     ───────────────────────────────────────────── */
  const GAMES = [
    {
      id: 1,
      title: "Bad Parenting 1",
      tag: "action",
      plays: "876.1k",
      emoji: "👦",
      gradient: "linear-gradient(135deg,#2d4a1e,#1a3a0a)",
      file: "1.html"
    },
    {
      id: 2,
      title: "OVO",
      tag: "other",
      plays: "4.1m",
      emoji: "⭕",
      gradient: "linear-gradient(135deg,#1a1a2e,#16213e)",
      file: "2.html"
    },
    {
      id: 3,
      title: "Minecraft 1.12.2",
      tag: "sandbox",
      plays: "2.2m",
      emoji: "⛏️",
      gradient: "linear-gradient(135deg,#4a3728,#2d5a1b)",
      file: "3.html"
    },
    {
      id: 4,
      title: "FNAF: Sister Location",
      tag: "horror",
      plays: "405.0k",
      emoji: "🐻",
      gradient: "linear-gradient(135deg,#0d0d1a,#1a0a2e)",
      file: "4.html"
    },
    {
      id: 5,
      title: "FNAF: Pizza Simulator",
      tag: "horror",
      plays: "397.4k",
      emoji: "🍕",
      gradient: "linear-gradient(135deg,#2e1a0a,#1a0a0a)",
      file: "5.html"
    },
    {
      id: 6,
      title: "People Playground",
      tag: "sandbox",
      plays: "1.2m",
      emoji: "🧍",
      gradient: "linear-gradient(135deg,#1a1a1a,#2d2d2d)",
      file: "6.html"
    },
    {
      id: 7,
      title: "R.E.P.O",
      tag: "horror",
      plays: "488.0k",
      emoji: "😂",
      gradient: "linear-gradient(135deg,#2e2a0a,#1a1500)",
      file: "7.html"
    },
    {
      id: 8,
      title: "ULTRAKILL",
      tag: "shooter",
      plays: "987.0k",
      emoji: "🔫",
      gradient: "linear-gradient(135deg,#2e0a0a,#1a0000)",
      file: "8.html"
    },
    {
      id: 9,
      title: "Buckshot Roulette",
      tag: "horror",
      plays: "1.4m",
      emoji: "🎰",
      gradient: "linear-gradient(135deg,#0a0a0a,#1a1010)",
      file: "9.html"
    },
    {
      id: 10,
      title: "Bendy and the Ink Machine",
      tag: "horror",
      plays: "515.5k",
      emoji: "🖋️",
      gradient: "linear-gradient(135deg,#1a1400,#0d0d00)",
      file: "10.html"
    },
    {
      id: 11,
      title: "That's Not My Neighbor",
      tag: "horror",
      plays: "1.3m",
      emoji: "👁️",
      gradient: "linear-gradient(135deg,#1a0a0a,#2e1a10)",
      file: "11.html"
    },
  ];

  const grid    = document.getElementById('grid');
  const empty   = document.getElementById('empty');
  const search  = document.getElementById('search');
  const tags    = document.querySelectorAll('.tag');
  const total   = document.getElementById('totalGames');

  total.textContent = GAMES.length;

  let activeFilter = 'all';

  function buildCard(g) {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = `viewer.html?game=${encodeURIComponent(g.file)}&title=${encodeURIComponent(g.title)}`;
    a.dataset.title = g.title.toLowerCase();
    a.dataset.tag   = g.tag;
    a.innerHTML = `
      <div class="card-thumb-placeholder" style="background:${g.gradient}">
        <span style="font-size:3rem">${g.emoji}</span>
      </div>
      <div class="card-overlay">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <polygon points="5,3 19,12 5,21" fill="currentColor"/>
        </svg>
      </div>
      <div class="card-body">
        <div class="card-title">${g.title}</div>
        <div class="card-meta">
          <span class="dot"></span>
          <span class="card-tag">${g.tag}</span>
          <span class="card-plays">${g.plays} plays</span>
        </div>
      </div>
    `;
    return a;
  }

  function render() {
    const q = search.value.toLowerCase().trim();
    let count = 0;
    grid.innerHTML = '';
    GAMES.forEach(g => {
      const matchTag   = activeFilter === 'all' || g.tag === activeFilter;
      const matchQuery = !q || g.title.toLowerCase().includes(q) || g.tag.includes(q);
      if (matchTag && matchQuery) {
        grid.appendChild(buildCard(g));
        count++;
      }
    });
    empty.style.display = count === 0 ? 'block' : 'none';
  }

  tags.forEach(btn => {
    btn.addEventListener('click', () => {
      tags.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      render();
    });
  });

  search.addEventListener('input', render);

  render();
</script>
</body>
</html>
