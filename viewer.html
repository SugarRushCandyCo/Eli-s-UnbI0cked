<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Eli's UnbI0cked — Game Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #0a0c12;
      --surface: #111420;
      --border:  #1e2540;
      --accent:  #00f0ff;
      --accent2: #ff2d78;
      --text:    #e8eaf6;
      --muted:   #5c6490;
      --glow:    0 0 18px rgba(0,240,255,.35);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
    }

    /* ── NAV BAR ── */
    #navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      z-index: 999;
      background: rgba(10,12,18,.96);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 1rem;
      gap: .75rem;
      transition: transform .3s ease;
    }
    #navbar.hidden {
      transform: translateY(-100%);
    }

    .nav-logo {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: .9rem;
      letter-spacing: .05em;
      color: var(--accent);
      text-shadow: var(--glow);
      white-space: nowrap;
      margin-right: .25rem;
    }
    .nav-logo span { color: var(--accent2); }

    .nav-sep {
      width: 1px; height: 22px;
      background: var(--border);
      flex-shrink: 0;
    }

    #game-title {
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: .04em;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .nav-btn {
      display: flex; align-items: center; gap: .35rem;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'Rajdhani', sans-serif;
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: .35rem .7rem;
      border-radius: 7px;
      cursor: pointer;
      text-decoration: none;
      transition: all .18s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .nav-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

    .nav-btn:hover {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(0,240,255,.08);
    }
    .nav-btn.danger:hover {
      color: var(--accent2);
      border-color: var(--accent2);
      background: rgba(255,45,120,.08);
    }
    .nav-btn.active {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(0,240,255,.1);
    }

    /* hide-bar toggle pill */
    #toggle-bar {
      position: fixed;
      top: 0; left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(10,12,18,.85);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 10px 10px;
      padding: 2px 14px 5px;
      cursor: pointer;
      transition: opacity .2s;
      font-size: .65rem;
      color: var(--muted);
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    #toggle-bar:hover { color: var(--accent); }
    #toggle-bar.up::before { content: '▲ show bar'; }
    #toggle-bar:not(.up)::before { content: '▼ hide bar'; }

    /* ── IFRAME CONTAINER ── */
    #frame-wrap {
      position: fixed;
      top: 52px; left: 0; right: 0; bottom: 0;
      transition: top .3s ease;
    }
    #frame-wrap.fullbar {
      top: 0;
    }

    #game-frame {
      width: 100%; height: 100%;
      border: none;
      display: block;
      background: #000;
    }

    /* ── POPUP / OVERLAY ── */
    #popup-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 2000;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
    }
    #popup-overlay.show { display: flex; }
    .popup-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2rem 2.5rem;
      text-align: center;
      max-width: 360px;
      width: 90%;
    }
    .popup-box h2 {
      font-family: 'Orbitron', monospace;
      font-size: 1.1rem;
      color: var(--accent);
      margin-bottom: .6rem;
    }
    .popup-box p { color: var(--muted); font-size: .95rem; margin-bottom: 1.5rem; }
    .popup-actions { display: flex; gap: .75rem; justify-content: center; }
    .popup-actions .nav-btn { font-size: .9rem; padding: .5rem 1.2rem; }
  </style>
</head>
<body>

<!-- ── TOP NAV ── -->
<div id="navbar">
  <div class="nav-logo">Eli's <span>UnbI0cked</span></div>
  <div class="nav-sep"></div>
  <span id="game-title">Loading…</span>

  <!-- Refresh -->
  <button class="nav-btn" id="btn-refresh" title="Reload game">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path d="M1 4v6h6M23 20v-6h-6"/>
      <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/>
    </svg>
    Reload
  </button>

  <!-- Fullscreen -->
  <button class="nav-btn" id="btn-full" title="Fullscreen">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
    </svg>
    Fullscreen
  </button>

  <!-- Focus / hide nav -->
  <button class="nav-btn" id="btn-focus" title="Focus mode">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="3"/><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/>
    </svg>
    Focus
  </button>

  <!-- Home -->
  <a class="nav-btn" href="index.html" title="Back to home">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
    Home
  </a>

  <!-- Exit (confirm) -->
  <button class="nav-btn danger" id="btn-exit" title="Exit game">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path d="M18 6 6 18M6 6l12 12"/>
    </svg>
    Exit
  </button>
</div>

<!-- hide/show pill -->
<div id="toggle-bar"></div>

<!-- ── GAME IFRAME ── -->
<div id="frame-wrap">
  <iframe id="game-frame" allowfullscreen></iframe>
</div>

<!-- ── EXIT CONFIRM POPUP ── -->
<div id="popup-overlay">
  <div class="popup-box">
    <h2>Leave Game?</h2>
    <p>Your progress may not be saved. Are you sure you want to exit?</p>
    <div class="popup-actions">
      <button class="nav-btn" id="popup-cancel">Keep Playing</button>
      <a class="nav-btn danger" href="index.html" id="popup-confirm">Exit to Home</a>
    </div>
  </div>
</div>

<script>
  /* ── Read which game to load from query string ──
     URL format:  viewer.html?game=1&title=Bad+Parenting+1
  */
  const params    = new URLSearchParams(location.search);
  const gameFile  = params.get('game')  || '1.html';
  const gameTitle = params.get('title') || 'Game';

  document.title = `${gameTitle} — Eli's UnbI0cked`;
  document.getElementById('game-title').textContent = gameTitle;
  document.getElementById('game-frame').src = gameFile;

  /* ── Reload ── */
  document.getElementById('btn-refresh').addEventListener('click', () => {
    const f = document.getElementById('game-frame');
    f.src = f.src; // force reload
  });

  /* ── Fullscreen ── */
  const btnFull = document.getElementById('btn-full');
  btnFull.addEventListener('click', () => {
    const el = document.getElementById('game-frame');
    if (!document.fullscreenElement) {
      el.requestFullscreen().catch(() => {});
      btnFull.classList.add('active');
      btnFull.innerHTML = `
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 0 2-2h3M3 16h3a2 2 0 0 0 2 2v3"/>
        </svg>
        Exit FS`;
    } else {
      document.exitFullscreen();
      btnFull.classList.remove('active');
      btnFull.innerHTML = `
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
        Fullscreen`;
    }
  });
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) {
      btnFull.classList.remove('active');
      btnFull.innerHTML = `
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
        Fullscreen`;
    }
  });

  /* ── Focus / hide bar ── */
  const navbar    = document.getElementById('navbar');
  const frameWrap = document.getElementById('frame-wrap');
  const togglePill= document.getElementById('toggle-bar');
  const btnFocus  = document.getElementById('btn-focus');
  let   hidden    = false;

  function setHidden(val) {
    hidden = val;
    if (hidden) {
      navbar.classList.add('hidden');
      frameWrap.classList.add('fullbar');
      togglePill.classList.add('up');
      btnFocus.classList.add('active');
    } else {
      navbar.classList.remove('hidden');
      frameWrap.classList.remove('fullbar');
      togglePill.classList.remove('up');
      btnFocus.classList.remove('active');
    }
  }

  btnFocus.addEventListener('click',   () => setHidden(!hidden));
  togglePill.addEventListener('click', () => setHidden(!hidden));

  /* ── Exit confirm ── */
  const overlay = document.getElementById('popup-overlay');
  document.getElementById('btn-exit').addEventListener('click', () => {
    overlay.classList.add('show');
  });
  document.getElementById('popup-cancel').addEventListener('click', () => {
    overlay.classList.remove('show');
  });
  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('show');
  });

  /* ── Keyboard shortcuts ── */
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && hidden) setHidden(false);
    if (e.key === 'F11')    { e.preventDefault(); btnFull.click(); }
    if (e.key === '`')      setHidden(!hidden);
  });
</script>
</body>
</html>
